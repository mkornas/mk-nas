# A tag vX.Y.Z → the agent's tests (the file-vdev pool test as root) → the .deb → a GitHub Release with the
# package, its checksum, and release.json naming the mk-drive version this release pins. That release.json and
# SHA256SUMS only fill the time until the maintainer signs: install/sign-release.sh builds the package from the tag
# on their own machine, compares it with this one, and replaces both with its own before signing. A box installs only
# the signed set. install/upgrade.sh on a laptop reads that release and puts it on a box.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag matches the agent's version
        run: |
          tag=${GITHUB_REF_NAME#v}
          have=$(node -p "require('./agent/package.json').version")
          [ "$tag" = "$have" ] || { echo "::error::tag v$tag but agent/package.json says $have — use install/release.sh"; exit 1; }
          drive=$(tr -d '[:space:]' < install/mk-drive/version)
          contract=$(grep -o 'export const CONTRACT = [0-9]*' agent/src/verbs.ts | grep -o '[0-9]*$')
          { echo "VERSION=$tag"; echo "DRIVE=$drive"; echo "CONTRACT=$contract"; } >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y zfsutils-linux smartmontools fakeroot
      - run: npm ci
        working-directory: agent
      - run: npm run typecheck
        working-directory: agent
      - run: sudo -E "$(command -v node)" --test 'test/**/*.test.ts'
        working-directory: agent
      - run: make deb
      - name: Assets and notes
        run: |
          mkdir -p out
          cp install/out/mk-nas_${VERSION}_amd64.deb out/
          # the pinned drive image's checksum as committed next to the pin (install/release.sh checked the image)
          image_sha=$(awk -v f="mk-drive-$DRIVE.tgz" '$2 == f {print $1}' install/mk-drive/sha256)
          [ -n "$image_sha" ] || { echo "::error::install/mk-drive/sha256 names no mk-drive-$DRIVE.tgz"; exit 1; }
          printf '{"agent":"%s","drive":"%s","contract":%s,"driveImageSha256":"%s"}\n' "$VERSION" "$DRIVE" "$CONTRACT" "$image_sha" > out/release.json
          (cd out && sha256sum mk-nas_${VERSION}_amd64.deb release.json > SHA256SUMS)
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "mk-nasd $VERSION, verb contract $CONTRACT. Pins **mk-drive $DRIVE** (\`ghcr.io/mkornas/mk-drive:$DRIVE\`)."
            echo
            echo "A box on 0.6.0 or newer shows this release under Storage → Overview → System and installs it from there, once it is signed. From another machine with this repo:"
            echo
            echo '```'
            echo "install/upgrade.sh <user>@<box>.local $VERSION"
            echo '```'
            echo
            echo "Both check the signature, take a settings backup, install the package, bring the pinned drive up and check both answer. By hand: \`sudo apt install ./mk-nas_${VERSION}_amd64.deb\` (docs/upgrading.md)."
            echo
            echo "## Changes${prev:+ since $prev}"
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" -- agent shared install .github | head -200
          } > out/notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: out/
          if-no-files-found: error

  # the only job that may write to the repository, and it runs no code from it
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" out/mk-nas_*_amd64.deb out/release.json out/SHA256SUMS --title "mk-nas $version" --notes-file out/notes.md --verify-tag
