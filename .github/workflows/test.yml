name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y zfsutils-linux smartmontools
      - run: npm ci
        working-directory: agent
      - run: npm run typecheck
        working-directory: agent
      # As root so the integration test can create a pool on file vdevs in /var/tmp.
      - run: sudo -E "$(command -v node)" --test 'test/**/*.test.ts'
        working-directory: agent
      - run: sudo apt-get install -y fakeroot && make deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mk-nas-deb
          path: install/out/mk-nas_*_amd64.deb
